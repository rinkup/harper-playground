name: Deploy to Harper Fabric

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harper-fabric-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy application
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out committed source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Harper Fabric
        env:
          HARPER_CLI_TARGET: ${{ secrets.HARPER_CLI_TARGET }}
          HARPER_CLI_REFRESH_TOKEN: ${{ secrets.HARPER_CLI_REFRESH_TOKEN }}
        run: |
          test -n "$HARPER_CLI_TARGET" || { echo "Missing HARPER_CLI_TARGET" >&2; exit 1; }
          test -n "$HARPER_CLI_REFRESH_TOKEN" || { echo "Missing HARPER_CLI_REFRESH_TOKEN" >&2; exit 1; }
          npx harper deploy project=pitsky-guard restart=true replicated=true
